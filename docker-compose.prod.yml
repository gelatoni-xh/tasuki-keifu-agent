services:
  governance-worker:
    image: tasuki-keifu-agent:latest
    container_name: tasuki-keifu-governance-worker
    command: ["npm", "run", "governance:event", "--", "worker"]
    env_file: .env.governance
    environment:
      NODE_OPTIONS: --max-old-space-size=160
      GOVERNANCE_DATABASE_URL: ${GOVERNANCE_DATABASE_URL:?Set runtime database URL in .env.governance}
      GOVERNANCE_READ_DATABASE_URL: ${GOVERNANCE_READ_DATABASE_URL:?Set read database URL in .env.governance}
      GOVERNANCE_PAYLOAD_DIR: /var/lib/tasuki-governance/payloads
      GOVERNANCE_WRITE_ENABLED: "false"
      GOVERNANCE_MAIL_ENABLED: "false"
    volumes:
      - governance-payloads:/var/lib/tasuki-governance/payloads
    networks: [tasuki-keifu]
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "npm", "run", "governance:event", "--", "health"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 90s
  governance-mail:
    image: tasuki-keifu-agent:latest
    command: ["npm", "run", "governance:event", "--", "mail-worker"]
    env_file: .env.governance
    environment:
      NODE_OPTIONS: --max-old-space-size=128
      GOVERNANCE_DATABASE_URL: ${GOVERNANCE_DATABASE_URL:?Set runtime database URL in .env.governance}
      GOVERNANCE_PAYLOAD_DIR: /var/lib/tasuki-governance/payloads
      GOVERNANCE_MAIL_ENABLED: "false"
    networks: [tasuki-keifu]
    mem_limit: 160m
    cpus: 0.25
    profiles: [mail]
    restart: unless-stopped
    stop_grace_period: 60s

networks:
  tasuki-keifu:
    external: true
    name: tasuki-keifu_default

volumes:
  governance-payloads:
