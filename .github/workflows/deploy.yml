name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://tasuki_keifu_user:dummy@localhost:5432/tasuki_keifu_agent

      - name: Type check
        run: npm run typecheck

      - name: Governance unit tests
        run: npm run test:governance

      - name: Build deploy image archive
        run: |
          docker build -t tasuki-keifu-agent:latest .
          docker save tasuki-keifu-agent:latest | gzip > tasuki-keifu-agent-image.tar.gz

      - name: Copy deployment files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.UBUNTU3_HOST }}
          username: ${{ secrets.UBUNTU3_USER }}
          key: ${{ secrets.UBUNTU3_SSH_KEY }}
          source: "tasuki-keifu-agent-image.tar.gz,docker-compose.prod.yml"
          target: "/tmp/tasuki-keifu-agent-deploy"

      - name: Deploy on Ubuntu-3
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.UBUNTU3_HOST }}
          username: ${{ secrets.UBUNTU3_USER }}
          key: ${{ secrets.UBUNTU3_SSH_KEY }}
          script: |
            set -euo pipefail
            mkdir -p /opt/apps/tasuki-keifu-agent
            cd /opt/apps/tasuki-keifu-agent
            test -f .env.governance
            cp docker-compose.prod.yml docker-compose.prod.yml.previous
            cp /tmp/tasuki-keifu-agent-deploy/docker-compose.prod.yml /opt/apps/tasuki-keifu-agent/docker-compose.prod.yml
            previous_image=$(sudo docker image inspect tasuki-keifu-agent:latest --format '{{.Id}}')
            sudo docker load -i /tmp/tasuki-keifu-agent-deploy/tasuki-keifu-agent-image.tar.gz
            if ! sudo docker compose -f docker-compose.prod.yml run --rm governance-worker node --import tsx src/governance-v2/cli.ts setup-checkpoints; then
              cp docker-compose.prod.yml.previous docker-compose.prod.yml
              sudo docker image tag "$previous_image" tasuki-keifu-agent:latest
              rm -f docker-compose.prod.yml.previous
              exit 1
            fi
            sudo docker compose --profile mail -f docker-compose.prod.yml up -d --remove-orphans
            healthy=false
            for attempt in $(seq 1 36); do
              if [ "$(sudo docker inspect tasuki-keifu-governance-worker --format '{{.State.Health.Status}}' 2>/dev/null || true)" = healthy ]; then
                healthy=true
                break
              fi
              sleep 5
            done
            if [ "$healthy" != true ]; then
              sudo docker compose -f docker-compose.prod.yml logs --tail=100 governance-worker || true
              cp docker-compose.prod.yml.previous docker-compose.prod.yml
              sudo docker image tag "$previous_image" tasuki-keifu-agent:latest
              sudo docker compose --profile mail -f docker-compose.prod.yml up -d --remove-orphans
              exit 1
            fi
            rm -f docker-compose.prod.yml.previous
            sudo docker image prune -f
